<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="description" content="Amir Ali Tuition Center management system – students, attendance, fees, homework, tests and reports. Works fully offline.">

<link rel="apple-touch-icon" href="icon-192.png">

<title>Amir Ali Tuition Center – Management System</title>
<style>
:root{--p:#6d28d9;--p2:#7c3aed;--p3:#8b5cf6;--pd:#4c1d95;--pl:#ede9fe;--pll:#f5f3ff;--ink:#1e1b4b;--mut:#6b7280;--line:#e5e7eb;--ok:#059669;--bad:#dc2626;--warn:#d97706;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--pll);color:var(--ink);font-size:15px;line-height:1.45}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
#side{width:262px;background:linear-gradient(180deg,#3b1578 0%,#6d28d9 62%,#7c3aed 100%);color:#fff;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:60;transition:transform .25s;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.15)}
.blogo{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.blogo img{width:100%;height:100%;object-fit:contain}
.blogo .mono{color:var(--p);font-weight:800;font-size:18px}
.bname{font-weight:800;font-size:15px;line-height:1.2}
.bsub{font-size:12px;opacity:.75}
#nav{padding:12px 10px;flex:1}
#nav a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;color:#ede9fe;text-decoration:none;font-weight:600;margin-bottom:3px;cursor:pointer}
#nav a:hover{background:rgba(255,255,255,.12)}
#nav a.active{background:#fff;color:var(--p);box-shadow:0 4px 14px rgba(0,0,0,.18)}
#nav a .ni{width:22px;text-align:center}
.sfoot{padding:14px 18px;font-size:12px;opacity:.8;border-top:1px solid rgba(255,255,255,.15)}
#main{margin-left:262px;flex:1;min-width:0}
#top{position:sticky;top:0;z-index:40;background:rgba(245,243,255,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid #ddd6fe}
#top h1{font-size:22px;color:var(--pd)}
.menu{display:none;border:0;background:var(--p);color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.today{font-size:13px;color:var(--mut);font-weight:600}
.sp{flex:1}
#view{padding:22px 24px 50px;max-width:1300px}
#overlay{display:none;position:fixed;inset:0;background:rgba(30,27,75,.5);z-index:55}
.card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:0 2px 14px rgba(76,29,149,.08);margin-bottom:18px}
.card h3{font-size:17px;color:var(--pd);margin-bottom:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.two>.card{margin-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 14px rgba(76,29,149,.08)}
.stat .ic{width:48px;height:48px;border-radius:13px;background:var(--pl);display:grid;place-items:center;font-size:23px;flex:none}
.stat b{display:block;font-size:22px;color:var(--pd);line-height:1.15}
.stat span{font-size:13px;color:var(--mut)}
.stat.g .ic{background:#d1fae5}.stat.r .ic{background:#fee2e2}.stat.o .ic{background:#fef3c7}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--p3);color:var(--p)}
.btn.pri{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(109,40,217,.28)}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.dan{color:var(--bad);border-color:#fecaca}
.btn.dan:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{min-width:220px}
.inl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--pd)}
input,select,textarea{border:1px solid #d1d5db;border-radius:10px;padding:9px 12px;background:#fff;width:100%;min-width:0}
.inl input,.inl select,.toolbar input,.toolbar select{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p3);border-color:var(--p3)}
textarea{resize:vertical;min-height:70px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px}
label.f>span{font-size:13px;font-weight:700;color:var(--pd)}
label.f.full{grid-column:1/-1}
.rq{color:var(--bad);font-style:normal}
.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--pl);color:var(--pd);text-align:left;padding:10px 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #f0eefc;vertical-align:middle}
.tbl tr:hover td{background:#faf8ff}
.tbl td.num,.tbl th.num{text-align:right}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:#d1fae5;color:#047857}.b-bad{background:#fee2e2;color:#b91c1c}.b-warn{background:#fef3c7;color:#b45309}.b-grey{background:#e5e7eb;color:#4b5563}.b-pur{background:var(--pl);color:var(--p)}
.mut{color:var(--mut)}.small{font-size:13px}
.empty{padding:30px;text-align:center;color:var(--mut);background:#faf8ff;border-radius:12px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:#fff;padding:5px;border-radius:12px;width:fit-content;max-width:100%;overflow-x:auto;box-shadow:0 2px 10px rgba(76,29,149,.07)}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--p);color:#fff}
.ab{width:44px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;margin-right:5px}
.ab.P.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.ab.A.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.ab.L.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1.5px solid #ddd6fe;background:var(--pll);color:var(--p);padding:6px 14px;border-radius:99px;font-weight:700;cursor:pointer}
.chip:hover{background:var(--p);color:#fff}
.chip b{background:#fff;color:var(--p);border-radius:99px;padding:0 7px;margin-left:5px}
.chart{display:flex;gap:10px;align-items:flex-end;height:230px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.bars{flex:1;display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center}
.bar{width:38%;max-width:34px;border-radius:7px 7px 0 0;min-height:2px;position:relative}
.bar.inc{background:linear-gradient(180deg,var(--p3),var(--p))}
.bar.exp{background:linear-gradient(180deg,#fca5a5,#ef4444)}
.bar span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.bl{font-size:12px;font-weight:700;color:var(--mut);margin-top:6px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f0eefc;font-size:14px}
.list li:last-child{border-bottom:0}
.banner{background:#fef3c7;color:#92400e;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:600}
.banner.bad{background:#fee2e2;color:#991b1b}
.mback{position:fixed;inset:0;background:rgba(30,27,75,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:580px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:920px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mhead h3{color:var(--pd);font-size:19px}
.docwrap{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;overflow:auto;max-height:68vh}
.docwrap .doc{min-width:640px}
.logobox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logoprev{width:130px;height:130px;border:2px dashed #c4b5fd;border-radius:16px;display:grid;place-items:center;overflow:hidden;background:var(--pll)}
.logoprev img{width:100%;height:100%;object-fit:contain}
.logoprev .mono{font-size:40px;font-weight:800;color:var(--p)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 30px);max-width:460px}
.tst{background:var(--pd);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s;text-align:center}
.tst.bad{background:#b91c1c}.tst.ok{background:#047857}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ---------- printable documents ---------- */
.doc{color:#111;font-size:13px;line-height:1.4}
.dh{display:flex;gap:16px;align-items:center;border-bottom:3px solid #6d28d9;padding-bottom:10px;margin-bottom:10px}
.dlogo{width:72px;height:72px;flex:none;display:grid;place-items:center;overflow:hidden}
.dlogo img{max-width:100%;max-height:100%;object-fit:contain}
.dlogo .mono{width:68px;height:68px;border-radius:50%;background:#6d28d9;color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dti h2{font-size:22px;color:#4c1d95}
.dti .tg{font-style:italic;color:#555}
.dti .ct{font-size:12px;color:#444}
.dtitle{text-align:center;font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:#ede9fe;color:#4c1d95;padding:7px;border-radius:6px;margin:8px 0 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dtitle small{display:block;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:#555}
.doc table{width:100%;border-collapse:collapse;margin:8px 0}
.doc th,.doc td{border:1px solid #888;padding:5px 8px;text-align:left}
.doc th{background:#ede9fe;color:#3b1578;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc td.num,.doc th.num{text-align:right}
.doc tr.tot td{font-weight:800;background:#f5f3ff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .info{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px;margin:6px 0 8px}
.doc .info div b{color:#4c1d95}
.doc .sig{display:flex;justify-content:space-between;gap:30px;margin-top:34px}
.doc .sig div{flex:1;border-top:1px solid #333;text-align:center;padding-top:4px;font-size:12px}
.doc .dfoot{margin-top:14px;font-size:11px;color:#666;text-align:center;border-top:1px dashed #aaa;padding-top:6px}
.doc .copy{border:1.5px solid #6d28d9;border-radius:8px;padding:12px 14px;margin-bottom:14px;page-break-inside:avoid;position:relative}
.doc .copytag{position:absolute;top:-10px;right:14px;background:#6d28d9;color:#fff;font-size:11px;font-weight:800;padding:1px 10px;border-radius:99px;letter-spacing:.06em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .sm td,.doc .sm th{padding:2px 6px;font-size:12px}
.doc .st-P{color:#047857;font-weight:800}.doc .st-A{color:#b91c1c;font-weight:800}.doc .st-L{color:#b45309;font-weight:800}.doc .off td{background:#f3f4f6;color:#777}
.doc.plain .dh{display:none}
#printArea{display:none}
@media print{
 @page{size:A4;margin:11mm}
 html,body{background:#fff!important}
 #app,#modalRoot,#toast,#bnav,#splash{display:none!important}
 #printArea{display:block!important}
 #printArea .doc{min-width:0}
}
@media(max-width:900px){
 #side{transform:translateX(-100%)}
 body.nav-open #side{transform:none}
 body.nav-open #overlay{display:block}
 #main{margin-left:0}
 .menu{display:block}
 #top{padding:12px 14px}
 #top h1{font-size:18px}
 .today{display:none}
 #view{padding:14px 12px 40px}
}
@media(max-width:560px){
 .toolbar input[type=search],.toolbar .inl,.toolbar select{width:100%}
 .inl{flex-wrap:wrap}
 .inl input,.inl select{flex:1}
 .btn{padding:9px 12px}
 .card{padding:15px}
 .modal{padding:16px}
 .stat b{font-size:19px}
}

/* ================= PWA / mobile app layer ================= */
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#top{padding-top:calc(12px + env(safe-area-inset-top))}
#side{padding-top:env(safe-area-inset-top)}
.sinstall{margin:0 12px 12px;justify-content:center;background:#fff;color:var(--p);border-color:transparent}
#splash{display:none;position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 36%,#7c3aed 0%,#5b21b6 55%,#3b1578 100%);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;transition:opacity .45s ease,visibility .45s}
html.standalone #splash{display:flex}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:150px;height:150px;animation:spop .8s cubic-bezier(.2,1.25,.4,1)}
#splash .sname{font-size:26px;font-weight:800;letter-spacing:.01em;margin-top:6px;animation:sfade .9s .15s both}
#splash .stag{font-size:14px;opacity:.85;animation:sfade .9s .3s both}
#splash .sbar{width:120px;height:4px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:26px}
#splash .sbar i{display:block;height:100%;width:40%;border-radius:9px;background:#fff;animation:sload 1s ease-in-out infinite}
@keyframes spop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes sfade{from{opacity:0;transform:translateY(8px)}to{opacity:.95;transform:none}}
@keyframes sload{0%{margin-left:-40%}100%{margin-left:100%}}
#bnav{display:none}
@media(max-width:900px){
 #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid #ddd6fe;box-shadow:0 -4px 16px rgba(76,29,149,.12);padding-bottom:env(safe-area-inset-bottom)}
 #bnav a,#bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px;min-height:58px;border:0;background:none;color:var(--mut);font-size:11px;font-weight:700;text-decoration:none;cursor:pointer;min-width:0}
 #bnav .bi{font-size:21px;line-height:1}
 #bnav a.active{color:var(--p)}
 #bnav a.active .bi{transform:scale(1.15)}
 #view{padding-bottom:96px}
 #toast{bottom:78px}
 input,select,textarea{font-size:16px}
 .btn{min-height:42px}
 .btn.sm{min-height:36px}
}
@media(max-width:560px){
 .mback{padding:0}
 .modal{border-radius:20px 20px 0 0;max-width:none;margin:auto 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
 .stats{grid-template-columns:1fr 1fr;gap:10px}
 .stat{flex-direction:column;align-items:flex-start;gap:8px;padding:13px}
 .stat .ic{width:40px;height:40px;font-size:20px}
 .stat b{font-size:18px}
 .stat span{font-size:12px}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="splash-logo.png" alt=""><div class="sname">Amir Ali Tuition Center</div><div class="stag">Quality Education at Home</div><div class="sbar"><i></i></div></div>
<div id="app">
 <div id="overlay" data-act="closeNav"></div>
 <aside id="side">
  <div class="brand"><div class="blogo" id="brandLogo"></div><div><div class="bname" id="brandName"></div><div class="bsub">Management System</div></div></div>
  <nav id="nav"></nav>
  <button class="btn sinstall" id="installBtn" data-act="installApp" hidden>📲 Install App</button>
  <div class="sfoot" id="storeInfo"></div>
 </aside>
 <div id="main">
  <header id="top"><button class="menu" data-act="openNav" aria-label="Open menu">☰</button><h1 id="pageTitle"></h1><div class="sp"></div><div class="today" id="todayLbl"></div></header>
  <main id="view"></main>
 </div>
</div>
<nav id="bnav" aria-label="Main menu"><a href="#dashboard" data-p="dashboard"><span class="bi">🏠</span>Home</a><a href="#students" data-p="students"><span class="bi">🎓</span>Students</a><a href="#attendance" data-p="attendance"><span class="bi">🗓️</span>Attendance</a><a href="#fees" data-p="fees"><span class="bi">💰</span>Fees</a><button type="button" data-act="openNav"><span class="bi">☰</span>More</button></nav>
<datalist id="classList"><option value="Play Group"><option value="Nursery"><option value="Prep"><option value="KG1"><option value="KG2"><option value="Class 1"><option value="Class 2"><option value="Class 3"><option value="Class 4"><option value="Class 5"><option value="Class 6"><option value="Class 7"><option value="Class 8"><option value="Class 9"><option value="Class 10"><option value="Inter"></datalist>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
(function(){
'use strict';

var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n,l){return String(n).padStart(l||2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function curMonth(){return today().slice(0,7);}
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtDate(iso){if(!iso)return '';var p=iso.split('-');if(p.length<3)return iso;return p[2]+' '+MONTHS[+p[1]-1].slice(0,3)+' '+p[0];}
function monthLabel(ym){var p=ym.split('-');return MONTHS[+p[1]-1]+' '+p[0];}
function dim(ym){var p=ym.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
function addMonths(ym,n){var p=ym.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function dowOf(ym,day){var p=ym.split('-').map(Number);return new Date(p[0],p[1]-1,day).getDay();}
function money(n){return ((DB&&DB.settings&&DB.settings.currency)||'Rs')+' '+Math.round(+n||0).toLocaleString('en-US');}
function short(n){n=Math.round(n);return n>=1000000?(n/1000000).toFixed(1).replace('.0','')+'M':n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':String(n);}
function byName(a,b){return String(a.name).localeCompare(String(b.name),undefined,{sensitivity:'base'});}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');}
function bind(sel,ev,fn){var el=$(sel);if(el)el.addEventListener(ev,fn);}
function opts(list,sel){return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join('');}

/* ===================== data ===================== */
var DB,storageOK=true;
function skeleton(){return {v:1,students:[],attendance:{},fees:[],homework:[],tests:[],marks:{},expenses:[],counters:{student:0,receipt:0},settings:{name:'Amir Ali Tuition Center',tagline:'Quality Education at Home',phone:'',address:'',currency:'Rs',logo:'',lastBackup:''}};}
function mkStudent(n,name,father,cls){return {id:'stu_'+n,adm:'AA-'+pad(n,3),name:name,father:father,cls:cls||'',school:'',phone:'',phone2:'',address:'',fee:0,joined:today(),status:'active',notes:''};}
function defaults(){var d=skeleton();d.students=[mkStudent(1,'Hajra','Nazeer Ahmed','KG1'),mkStudent(2,'Anam','Javeed',''),mkStudent(3,'Mustaf','Ahmed',''),mkStudent(4,'Muskan','Ahmed','')];d.counters.student=4;d.settings.logo=DEFAULT_LOGO;return d;}
function normalize(d){
 var b=skeleton();d=(d&&typeof d==='object')?d:{};
 ['students','fees','homework','tests','expenses'].forEach(function(k){b[k]=Array.isArray(d[k])?d[k]:[];});
 b.attendance=(d.attendance&&typeof d.attendance==='object'&&!Array.isArray(d.attendance))?d.attendance:{};
 b.marks=(d.marks&&typeof d.marks==='object'&&!Array.isArray(d.marks))?d.marks:{};
 if(d.settings&&typeof d.settings==='object'){Object.keys(b.settings).forEach(function(k){if(d.settings[k]!=null)b.settings[k]=d.settings[k];});}
 b.students=b.students.filter(function(s){return s&&s.id;}).map(function(s){return Object.assign({adm:'',name:'',father:'',cls:'',school:'',phone:'',phone2:'',address:'',fee:0,joined:today(),status:'active',notes:''},s);});
 var mx=0;b.students.forEach(function(s){var m=/(\d+)$/.exec(s.adm||'');if(m)mx=Math.max(mx,+m[1]);});
 var mr=0;b.fees.forEach(function(f){var m=/(\d+)$/.exec(f.receiptNo||'');if(m)mr=Math.max(mr,+m[1]);});
 b.counters={student:Math.max(mx,+(d.counters&&d.counters.student)||0,b.students.length),receipt:Math.max(mr,+(d.counters&&d.counters.receipt)||0)};
 return b;
}
function load(){
 try{var raw=localStorage.getItem(KEY);if(raw){DB=normalize(JSON.parse(raw));return;}}catch(e){storageOK=false;}
 DB=defaults();save(true);
}
function save(quiet){
 try{localStorage.setItem(KEY,JSON.stringify(DB));return true;}
 catch(e){storageOK=false;if(!quiet)toast('Could not save: browser storage is full or blocked. Please download a backup!','bad');return false;}
}
function stu(id){return DB.students.find(function(s){return s.id===id;});}
function stuName(id){var s=stu(id);return s?s.name:'(deleted student)';}
function activeStudents(){return DB.students.filter(function(s){return s.status==='active';}).sort(byName);}
function classes(){var m={};DB.students.forEach(function(s){if(s.cls)m[s.cls]=1;});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});}
function feeExpected(s,ym){if(s.joined&&s.joined.slice(0,7)>ym)return 0;return +s.fee||0;}
function paidFor(sid,ym){return DB.fees.filter(function(f){return f.studentId===sid&&f.month===ym;}).reduce(function(a,f){return a+(+f.amount||0);},0);}
function dueFor(s,ym){return Math.max(0,feeExpected(s,ym)-paidFor(s.id,ym));}
function incomeOf(ym){return DB.fees.filter(function(f){return (f.paidOn||'').slice(0,7)===ym;}).reduce(function(a,f){return a+(+f.amount||0);},0);}
function expenseOf(ym){return DB.expenses.filter(function(e){return (e.date||'').slice(0,7)===ym;}).reduce(function(a,e){return a+(+e.amount||0);},0);}
function grade(p){return p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':p>=40?'E':'F';}

 return '<div class="chart">'+data.map(function(d){
  return '<div class="bar-col"><div class="bars"><div class="bar inc" style="height:'+(d.i/max*88)+'%" title="Income '+esc(money(d.i))+'"><span>'+(d.i?short(d.i):'')+'</span></div><div class="bar exp" style="height:'+(d.e/max*88)+'%" title="Expenses '+esc(money(d.e))+'"><span>'+(d.e?short(d.e):'')+'</span></div></div><div class="bl">'+MONTHS[+d.m.slice(5)-1].slice(0,3)+'</div></div>';

function studentForm(s){
 s=s||{};
 return '<div class="fg">'+
  fld('Student Name','name',s.name,'required maxlength="80" autocomplete="off"')+
  fld("Father's Name",'father',s.father,'required maxlength="80" autocomplete="off"')+
  classField('Class','cls',s.cls)+
  fld('School (optional)','school',s.school,'maxlength="80"')+
  fld('Phone / WhatsApp','phone',s.phone,'inputmode="tel" maxlength="30" placeholder="03xx-xxxxxxx"','tel')+
  fld('Second Phone (optional)','phone2',s.phone2,'inputmode="tel" maxlength="30"','tel')+
  fld('Monthly Fee','fee',s.fee||'','min="0" step="1" inputmode="numeric" placeholder="0"','number')+

function readStudent(f){
 var d=new FormData(f),g=function(k){return String(d.get(k)==null?'':d.get(k)).trim();};
 if(!g('name')){toast('Student Name is required','bad');f.elements.name.focus();return null;}
 if(!g('father')){toast("Father's Name is required",'bad');f.elements.father.focus();return null;}
 var fee=parseFloat(g('fee'));if(isNaN(fee)||fee<0)fee=0;
 return {name:g('name'),father:g('father'),cls:g('cls'),school:g('school'),phone:g('phone'),phone2:g('phone2'),fee:fee,joined:g('joined')||today(),address:g('address'),notes:g('notes')};
}
function stuRows(){
 var q=ui.stuQ.trim().toLowerCase();
 var L=DB.students.filter(function(s){
  return (ui.stuStatus==='all'||s.status===ui.stuStatus)&&(!ui.stuClass||s.cls===ui.stuClass)&&(!q||[s.name,s.father,s.cls,s.phone,s.phone2,s.adm,s.school].join(' ').toLowerCase().indexOf(q)>-1);
 }).sort(byName);

  DB.fees=DB.fees.filter(function(f){return f.studentId!==s.id;});
  Object.keys(DB.marks).forEach(function(t){delete DB.marks[t][s.id];});
  save();toast('Student deleted','ok');route();
 },'Delete Student');

SUB.register=function(f){
 var d=readStudent(f);if(!d)return;
 var dup=DB.students.some(function(s){return norm(s.name)===norm(d.name)&&norm(s.father)===norm(d.father);});
 var add=function(){
  DB.counters.student++;
  var s=Object.assign({id:uid('stu_'),adm:'AA-'+pad(DB.counters.student,3),status:'active'},d);
  DB.students.push(s);save();toast('Registered '+s.name+' ('+s.adm+')','ok');go('students');
 };
 if(dup)confirmBox('A student named '+d.name+' with father '+d.father+' already exists. Register anyway?',add,'Register anyway','Possible duplicate');else add();
};

 var L=testStudents(t),out={},bad=null;
 L.forEach(function(s){var raw=String(new FormData(f).get('m_'+s.id)||'').trim();if(raw==='')return;var n=parseFloat(raw);if(isNaN(n)||n<0||n>t.total){bad=s.name;return;}out[s.id]=n;});

function resultsDoc(t){
 var m=DB.marks[t.id]||{},L=testStudents(t);
 Object.keys(m).forEach(function(id){var s=stu(id);if(s&&!L.some(function(x){return x.id===id;}))L.push(s);});

 var entered=rows.filter(function(r){return r.has;}).sort(function(a,b){return b.mk-a.mk;});
 entered.forEach(function(r,i){r.rank=(i>0&&entered[i-1].mk===r.mk)?entered[i-1].rank:i+1;});
 var rest=rows.filter(function(r){return !r.has;}).sort(function(a,b){return byName(a.s,b.s);});
 var all=entered.concat(rest);
 var avg=entered.length?entered.reduce(function(a,r){return a+r.mk;},0)/entered.length:0;
 var hi=entered.length?entered[0].mk:0,pass=entered.filter(function(r){return r.pc>=40;}).length;
 return docHeader('Test Result',t.title)+'<div class="info"><div><b>Subject:</b> '+esc(t.subject||'—')+'</div><div><b>Class:</b> '+esc(t.cls||'All')+'</div><div><b>Date:</b> '+esc(fmtDate(t.date))+'</div><div><b>Total marks:</b> '+esc(t.total)+'</div></div>'+
 '<table><thead><tr><th>Rank</th><th>Student</th><th>Father</th><th class="num">Marks</th><th class="num">%</th><th>Grade</th></tr></thead><tbody>'+all.map(function(r){return '<tr><td>'+(r.has?r.rank:'—')+'</td><td>'+esc(r.s.name)+'</td><td>'+esc(r.s.father)+'</td><td class="num">'+(r.has?esc(r.mk):'Absent')+'</td><td class="num">'+(r.has?r.pc.toFixed(1):'')+'</td><td>'+(r.has?grade(r.pc):'')+'</td></tr>';}).join('')+'</tbody></table>'+
 '<p>Students appeared: <b>'+entered.length+'</b> &nbsp; Average: <b>'+avg.toFixed(1)+'</b> &nbsp; Highest: <b>'+hi+'</b> &nbsp; Passed (40%+): <b>'+pass+'</b></p><div class="sig"><div>Subject Teacher</div><div>Principal</div></div>'+docFoot();
}

/* ===================== REPORTS ===================== */
function attSummaryDoc(ym){
 var rows=activeStudents().map(function(s,i){var c=attMonthData(s.id,ym).c,t=c.P+c.A+c.L;return '<tr><td>'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.father)+'</td><td>'+esc(s.cls)+'</td><td class="num">'+c.P+'</td><td class="num">'+c.A+'</td><td class="num">'+c.L+'</td><td class="num">'+(t?Math.round(c.P/t*100)+'%':'—')+'</td></tr>';}).join('');
 return docHeader('Monthly Attendance Summary',monthLabel(ym))+'<table class="sm"><thead><tr><th>#</th><th>Student</th><th>Father</th><th>Class</th><th class="num">Present</th><th class="num">Absent</th><th class="num">Leave</th><th class="num">%</th></tr></thead><tbody>'+rows+'</tbody></table>'+docFoot();
}
function pgReports(v){
 ui.repMonth=ui.repMonth||curMonth();
 var all=DB.students.slice().sort(byName);if(!stu(ui.repStu)&&all.length)ui.repStu=all[0].id;
 v.innerHTML='<div class="card"><div class="toolbar"><label class="inl">Report month <input type="month" id="rM" value="'+esc(ui.repMonth)+'"></label><label class="inl">Student <select id="rS">'+all.map(function(s){return '<option value="'+s.id+'"'+(s.id===ui.repStu?' selected':'')+'>'+esc(s.name+' ('+s.father+')')+'</option>';}).join('')+'</select></label></div><p class="mut small">Choose a month and/or student, then open a report. Every report has a Print / Save as PDF button and includes your logo.</p></div>'+
 '<div class="two">'+
 [['feeRep','💰','Monthly Fee Report','Collected, pending and balance for every student.'],
  ['finRep','📊','Income & Expense Statement','All fee receipts and expenses with net balance.'],
  ['attRep','🗓️','Attendance Summary','Present / absent / leave totals for the month.'],
  ['attStuRep','👤','Student Attendance (full month)','Day-by-day attendance of the selected student.'],
  ['marksRep','📝','Student Marks Report','All test marks of the selected student.'],
  ['stuRep','🎓','Student List','Complete list with fathers, classes and phones.']].map(function(r){return '<div class="card"><h3>'+r[1]+' '+r[2]+'</h3><p class="mut">'+r[3]+'</p><button class="btn pri" data-act="rep" data-r="'+r[0]+'">Open Report</button></div>';}).join('')+'</div>';
 bind('#rM','change',function(e){ui.repMonth=e.target.value||curMonth();});
 bind('#rS','change',function(e){ui.repStu=e.target.value;});
}
ACT.rep=function(el){
 var r=el.dataset.r,ym=ui.repMonth||curMonth(),s=stu(ui.repStu);
 if(r==='feeRep')openDoc('Monthly Fee Report',feeReportDoc(ym),'Fee_Report_'+ym);
 else if(r==='finRep')openDoc('Income & Expense Statement',financeDoc(ym),'Income_Expense_'+ym);
 else if(r==='attRep')openDoc('Attendance Summary',attSummaryDoc(ym),'Attendance_Summary_'+ym);
 else if(r==='stuRep')openDoc('Student List',studentListDoc(),'Student_List');
 else if(!s)toast('No student selected','bad');
 else if(r==='attStuRep')openDoc('Monthly Attendance Report',docHeader('Monthly Attendance Report',monthLabel(ym))+attReportInner(s,ym)+'<div class="sig"><div>Class Teacher</div><div>Parent Signature</div><div>Principal</div></div>'+docFoot(),'Attendance_'+s.name+'_'+ym);
 else if(r==='marksRep')openDoc('Student Marks Report',marksReportDoc(s.id),'Marks_'+s.name);
};

/* ===================== SETTINGS / BACKUP ===================== */
function pgSettings(v){
 var s=DB.settings;
 v.innerHTML='<div class="two"><div class="card"><h3>Center Information</h3><form data-submit="saveSettings"><div class="fg">'+fld('Center name','name',s.name,'required maxlength="80"')+fld('Tagline','tagline',s.tagline,'maxlength="100"')+fld('Phone','phone',s.phone,'maxlength="40"','tel')+fld('Currency symbol','currency',s.currency||'Rs','maxlength="6"')+fld('Address','address',s.address,'maxlength="160"','text','full')+'</div><div class="actions"><button class="btn pri" type="submit">Save Settings</button></div></form></div>'+
 '<div class="card"><h3>Logo</h3><div class="logobox"><div class="logoprev" id="logoPrev">'+logoHTML()+'</div><div><p class="mut small" style="margin:0 0 10px">The logo appears on fee slips, receipts and all printed reports. PNG / JPG recommended.</p><div class="row"><button class="btn pri" data-act="logoPick">'+(s.logo?'🔄 Change Logo':'⬆️ Upload Logo')+'</button>'+(s.logo?'<button class="btn dan" data-act="logoRemove">Remove Logo</button>':'')+'</div></div></div><input type="file" id="logoFile" accept="image/*" hidden></div>'+
 '<div class="card"><h3>Backup & Restore</h3><p class="mut small" style="margin-top:-6px">All data is saved automatically in this browser. Download a backup file regularly and keep it somewhere safe (e.g. WhatsApp to yourself or Google Drive).</p><p class="small">Stored: <b>'+DB.students.length+'</b> students, <b>'+DB.fees.length+'</b> payments, <b>'+DB.tests.length+'</b> tests, <b>'+DB.expenses.length+'</b> expenses.<br>Last backup: <b>'+(s.lastBackup?esc(fmtDate(s.lastBackup)):'never')+'</b></p><div class="row"><button class="btn pri" data-act="backup">⬇️ Download Backup</button><button class="btn" data-act="restorePick">⬆️ Restore from Backup</button></div><input type="file" id="restoreFile" accept=".json,application/json" hidden></div>'+
 installCardHTML()+'<div class="card"><h3>Danger Zone</h3><p class="mut small" style="margin-top:-6px">Erase everything and start with a completely empty system.</p><button class="btn dan" data-act="resetAll">🗑 Erase All Data</button></div></div>';
 bind('#logoFile','change',function(e){handleLogo(e.target.files&&e.target.files[0]);e.target.value='';});
 bind('#restoreFile','change',function(e){handleRestore(e.target.files&&e.target.files[0]);e.target.value='';});
}
SUB.saveSettings=function(f){
 var d=new FormData(f),g=function(k){return String(d.get(k)||'').trim();};
 if(!g('name')){toast('Center name is required','bad');return;}
 Object.assign(DB.settings,{name:g('name'),tagline:g('tagline'),phone:g('phone'),address:g('address'),currency:g('currency')||'Rs'});
 save();refreshBrand();toast('Settings saved','ok');pgSettings($('#view'));
};
ACT.logoPick=function(){var i=$('#logoFile');if(i)i.click();};
function handleLogo(file){
 if(!file)return;
 if(!/^image\//.test(file.type)){toast('Please choose an image file (PNG or JPG)','bad');return;}
 var fr=new FileReader();
 fr.onerror=function(){toast('Could not read that file','bad');};
 fr.onload=function(){
  var img=new Image();
  img.onerror=function(){toast('Could not open that image','bad');};
  img.onload=function(){
   var max=420,w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,sc=Math.min(1,max/Math.max(w,h,1));
   w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
   var url=fr.result;
   try{var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);url=c.toDataURL('image/png');}catch(e){}
   DB.settings.logo=url;
   if(save()){refreshBrand();toast('Logo updated','ok');}
   if(curPage==='settings')pgSettings($('#view'));
  };
  img.src=fr.result;
 };
 fr.readAsDataURL(file);
}
ACT.logoRemove=function(){confirmBox('Remove the logo? Printed documents will show the center initials instead.',function(){DB.settings.logo='';save();refreshBrand();toast('Logo removed','ok');pgSettings($('#view'));},'Remove Logo');};
ACT.backup=function(){
 DB.settings.lastBackup=today();save(true);
 var blob=new Blob([JSON.stringify({app:'AmirAliTuitionCenter',version:1,exported:new Date().toISOString(),data:DB},null,1)],{type:'application/json'});
 var a=document.createElement('a'),url=URL.createObjectURL(blob);
 a.href=url;a.download='AmirAli_Tuition_Backup_'+today()+'.json';document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(url);a.remove();},800);
 toast('Backup downloaded','ok');if(curPage==='settings')pgSettings($('#view'));
};
ACT.restorePick=function(){var i=$('#restoreFile');if(i)i.click();};
function handleRestore(file){
 if(!file)return;
 var fr=new FileReader();
 fr.onerror=function(){toast('Could not read the backup file','bad');};
 fr.onload=function(){
  var obj;try{obj=JSON.parse(fr.result);}catch(e){toast('This is not a valid backup file','bad');return;}
  var data=obj&&obj.data?obj.data:obj;
  if(!data||!Array.isArray(data.students)){toast('This file does not look like an Amir Ali Tuition backup','bad');return;}
  confirmBox('Restore backup with '+data.students.length+' student(s)? This will REPLACE all current data on this device.',function(){
   DB=normalize(data);save();refreshBrand();toast('Backup restored successfully','ok');go('dashboard');
  },'Restore Backup','Restore backup');
 };
 fr.readAsText(file);
}
ACT.resetAll=function(){
 confirmBox('This will permanently erase ALL students, attendance, fees, tests, expenses and the logo. Download a backup first if unsure.',function(){
  DB=skeleton();save();refreshBrand();toast('All data erased','ok');go('dashboard');
 },'Erase Everything','Erase all data?');
};


/* ===================== PWA layer (install, offline, splash) ===================== */
var deferredPrompt=null,swState='unsupported',persistState='unknown';
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function installInner(){
 var inst,btn='';
 if(isStandalone())inst='<span class="badge b-ok">✔ Installed – running as an app</span>';
 else if(deferredPrompt){inst='<span class="badge b-pur">Ready to install</span>';btn='<button class="btn pri" data-act="installApp">📲 Install App on this device</button>';}
 else{inst='<span class="badge b-warn">Not installed yet</span>';btn='<button class="btn" data-act="installApp">📲 How to install</button>';}
 var off=swState==='ready'?'<span class="badge b-ok">✔ Offline mode ready</span>':swState==='installing'?'<span class="badge b-warn">Preparing offline mode…</span>':'<span class="badge b-grey">Offline mode needs the https (hosted) version</span>';
 var st=persistState==='granted'?'<span class="badge b-ok">✔ Storage protected</span>':'<span class="badge b-grey">Keep regular backups</span>';
 return '<h3>📲 Install as App</h3><p class="mut small" style="margin-top:-6px">Install this system on your phone like WhatsApp: home-screen icon, full-screen window and it works without internet. Your data stays on this device.</p><div class="pills">'+inst+off+st+'</div>'+(btn?'<div class="actions" style="margin-top:4px">'+btn+'</div>':'');
}
function installCardHTML(){return '<div class="card" id="pwaCard">'+installInner()+'</div>';}
function refreshInstallUI(){
 var b=$('#installBtn');if(b)b.hidden=!deferredPrompt||isStandalone();
 var c=$('#pwaCard');if(c)c.innerHTML=installInner();
}
ACT.installApp=function(){
 if(deferredPrompt){
  var p=deferredPrompt;deferredPrompt=null;refreshInstallUI();
  try{p.prompt();if(p.userChoice)p.userChoice.then(function(r){if(r&&r.outcome==='accepted')toast('Installing… check your home screen','ok');});}catch(e){}
  return;
 }
 if(isStandalone()){toast('Already installed and running as an app','ok');return;}
 var hosted=/^https?:$/.test(location.protocol);
 openModal('<div class="mhead"><h3>📲 Install on Android</h3></div>'+(hosted?'':'<p class="banner bad">This copy is opened from a file. Android can only install it when it is opened from its https web address (see the setup guide).</p>')+'<ol style="line-height:1.9;padding-left:20px;margin-top:0"><li>Open this app’s web address in <b>Chrome</b> (not inside WhatsApp or Facebook).</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Install app</b> (or <b>Add to Home screen</b> → <b>Install</b>).</li><li>Tap <b>Install</b> to confirm, then open <b>Amir Ali</b> from your home screen.</li></ol><div class="actions"><button class="btn pri" data-act="closeModal">OK</button></div>');
};
function pwaInit(){
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;refreshInstallUI();});
 window.addEventListener('appinstalled',function(){deferredPrompt=null;toast('App installed! Open it from your home screen','ok');refreshInstallUI();});
 window.addEventListener('online',function(){toast('Back online','ok');});
 window.addEventListener('offline',function(){toast('You are offline – everything still works and saves','ok');});
 try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(function(g){persistState=g?'granted':'not granted';refreshInstallUI();}).catch(function(){});}}catch(e){}
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  swState='installing';
  navigator.serviceWorker.register('sw.js').then(function(reg){
   navigator.serviceWorker.ready.then(function(){swState='ready';refreshInstallUI();});
   reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('App updated – the new version loads next time you open it','ok');});});
  }).catch(function(){swState='unsupported';refreshInstallUI();});
 }
 refreshInstallUI();
 var sp=$('#splash');
 if(sp){var wait=document.documentElement.classList.contains('standalone')?1200:0;setTimeout(function(){sp.classList.add('hide');setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp);},600);},wait);}
}

/* ===================== start ===================== */
window.addEventListener('hashchange',route);
load();
buildNav();refreshBrand();
$('#todayLbl').textContent=DAYS[new Date().getDay()]+', '+fmtDate(today());
route();
pwaInit();
window.__AATC={get DB(){return DB;},route:route,ACT:ACT,SUB:SUB,ui:ui};
})();
</script>
